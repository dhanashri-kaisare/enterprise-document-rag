- name: Run 25-Case RAG Eval Suite (Quality Gate >= 85%)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: |
          python -c "
          import subprocess, sys, re
          res = subprocess.run(['pytest', 'tests/test_rag_eval.py', '-v', '--tb=short'], capture_output=True, text=True)
          print(res.stdout)
          print(res.stderr)
          m = re.search(r'(\d+) passed', res.stdout)
          passed = int(m.group(1)) if m else 0
          pass_rate = (passed / 25) * 100
          print(f'Evaluation Pass Rate: {passed}/25 ({pass_rate:.1f}%)')
          sys.exit(0 if pass_rate >= 85.0 else 1)
          "